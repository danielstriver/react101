<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; }
        nav { display: flex; justify-content: space-around; background: #333; color: white; padding: 15px; }
        .hero { height: 60vh; background: #007bff; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .services { display: flex; padding: 50px; justify-content: space-between; }
        .box { flex: 1; padding: 20px; text-align: center; border: 1px solid #ddd; margin: 10px; border-radius: 10px; }
        button { background: #ffc107; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <nav><div>MyBrand</div> <div>Home | Projects | Contact</div></nav>
    <div class="hero">
        <h1>Creative Solutions</h1>
        <p>Turning complex problems into simple designs.</p>
        <button>View Work</button>
    </div>
    <div class="services">
        <div class="box"><h3>Web Design</h3><p>Modern and responsive.</p></div>
        <div class="box"><h3>Data Analysis</h3><p>Clear, actionable insights.</p></div>
        <div class="box"><h3>Consulting</h3><p>Expertise you can trust.</p></div>
    </div>
</body>
</html>
